name: Import Damned arrangement

on:
  push:
    paths:
      - '.github/workflows/import-damned.yml'

permissions:
  contents: write

jobs:
  import-damned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MIDI parser
        run: python -m pip install --disable-pip-version-check mido

      - name: Download verified source MIDI
        shell: bash
        run: |
          set -euo pipefail
          URL='https://robloxpianosheet.com/api/midi/black-ops-2-zombie-theme'
          PAGE='https://robloxpianosheet.com/sheets/black-ops-2-zombie-theme'
          curl -L --fail --retry 2 --connect-timeout 15 -A 'Mozilla/5.0' -e "$PAGE" "$URL" -o /tmp/damned.mid
          test "$(head -c 4 /tmp/damned.mid)" = 'MThd'
          ACTUAL_SHA="$(sha256sum /tmp/damned.mid | awk '{print toupper($1)}')"
          EXPECTED_SHA='26F66A460AB29AB60B55B333AE05070A7C7C1A7D76D4112F4C077D37007774B5'
          echo "Damned MIDI SHA-256: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Convert MIDI to Velora
        run: |
          cat > /tmp/convert_damned.py <<'PY'
          import hashlib
          import math
          from collections import defaultdict
          from pathlib import Path
          import mido

          MIDI_PATH = Path('/tmp/damned.mid')
          OUT_PATH = Path('songs/Damned.lua')
          REGISTRY = Path('Songs.lua')
          STEPS_PER_BEAT = 48
          MIN_NOTE, MAX_NOTE = 36, 96
          KEYS = list('1!2@34$5%6^78*9(0qQwWeErtTyYuUiIoOpPasSdDfgGhHjJklLzZxcCvVbBnm')
          assert len(KEYS) == 61
          KEY_FOR_NOTE = {MIN_NOTE + i: key for i, key in enumerate(KEYS)}

          raw = MIDI_PATH.read_bytes()
          sha256 = hashlib.sha256(raw).hexdigest().upper()
          mid = mido.MidiFile(MIDI_PATH)

          tempos, meters = [], []
          musical_tracks = 0
          track_names = []
          for track in mid.tracks:
              has_music = False
              track_name = None
              for msg in track:
                  if msg.type == 'track_name' and msg.name:
                      track_name = msg.name
                  elif msg.type == 'set_tempo':
                      tempos.append(msg.tempo)
                  elif msg.type == 'time_signature':
                      meters.append(f'{msg.numerator}/{msg.denominator}')
                  elif msg.type == 'note_on' and msg.velocity > 0 and getattr(msg, 'channel', -1) != 9:
                      has_music = True
              if has_music:
                  musical_tracks += 1
                  if track_name:
                      track_names.append(track_name)

          display_bpm = round(60_000_000 / (tempos[0] if tempos else 500_000))
          step_seconds = (60.0 / display_bpm) / STEPS_PER_BEAT

          tempo = 500_000
          current_seconds = 0.0
          source_note_ons = 0
          folded = 0
          events = defaultdict(set)

          for msg in mido.merge_tracks(mid.tracks):
              current_seconds += mido.tick2second(msg.time, mid.ticks_per_beat, tempo)
              if msg.type == 'set_tempo':
                  tempo = msg.tempo
                  continue
              if msg.type != 'note_on' or msg.velocity <= 0 or getattr(msg, 'channel', -1) == 9:
                  continue

              source_note_ons += 1
              note = msg.note
              original = note
              while note < MIN_NOTE:
                  note += 12
              while note > MAX_NOTE:
                  note -= 12
              if note != original:
                  folded += 1

              step = max(0, int(math.floor(current_seconds / step_seconds + 0.5)))
              events[step].add(note)

          if not events:
              raise SystemExit('No musical note-on events found in Damned MIDI')

          packed = []
          previous_step = -1
          for step in sorted(events):
              notes = sorted(events[step])
              token_keys = ''.join(KEY_FOR_NOTE[n] for n in notes)
              token = token_keys if len(token_keys) == 1 else f'[{token_keys}]'
              gap = max(0, step - previous_step - 1)
              packed.append(f'{gap}:{token}')
              previous_step = step

          lines, line = [], ''
          for item in packed:
              candidate = item if not line else line + ' ' + item
              if len(candidate) > 118:
                  lines.append(line)
                  line = item
              else:
                  line = candidate
          if line:
              lines.append(line)
          data = '\n'.join(lines)

          unique_meters = []
          for meter in meters:
              if meter not in unique_meters:
                  unique_meters.append(meter)
          meter_text = ', '.join(unique_meters) if unique_meters else 'not specified'
          track_text = ', '.join(track_names) if track_names else 'unnamed musical tracks'

          lua = f'''-- Velora 0.10.20 Nova — verified COD Zombies arrangement converted from MIDI.
          -- Song: Damned — Call of Duty: Black Ops Zombies.
          -- Original composition: Kevin Sherwood. Source page presents the Black Ops II Zombies theme arrangement under Brian Tuey.
          -- Verified source page: https://robloxpianosheet.com/sheets/black-ops-2-zombie-theme
          -- MIDI source: https://robloxpianosheet.com/api/midi/black-ops-2-zombie-theme
          -- Source verification: Online Sequencer MIDI export, verified by the source page on 2026-04-27.
          -- Source MIDI SHA-256: {sha256}
          -- MIDI: {mid.ticks_per_beat} PPQ, {len(tempos)} source tempo event(s), source time signature(s): {meter_text}.
          -- Timing normalized to real seconds at {display_bpm} BPM / {STEPS_PER_BEAT} Velora steps per beat.
          -- {musical_tracks} non-drum musical tracks retained ({track_text}); simultaneous duplicate pitches are merged.
          -- {source_note_ons:,} source note-on events processed.
          -- {folded:,} out-of-range note-on events were folded by octave into Velora's C2-C7 keyboard range.

          local DATA = [=[
          {data}
          ]=]

          local sheet = {{}}
          for encoded in DATA:gmatch("%S+") do
              local gap, token = encoded:match("^(%d+):(.+)$")
              gap = tonumber(gap)
              if gap and token then
                  for _ = 1, gap do
                      sheet[#sheet + 1] = "-"
                  end
                  sheet[#sheet + 1] = token
              end
          end

          return {{
              Id="damned-cod-black-ops-zombies",
              Name="Damned",
              Artist="Kevin Sherwood",
              BPM={display_bpm},
              StepsPerBeat={STEPS_PER_BEAT},
              Complete=true,
              Source="Verified Roblox Piano Sheet / Online Sequencer MIDI export",
              SourceLicense="Third-party composition and arrangement; rights remain with their respective owners.",
              Categories={{"Famous","Game OST","Call of Duty","Zombies","Dark","Piano","Horror","Complete"}},
              Notes=table.concat(sheet, " "),
          }}
          '''
          lua = '\n'.join(line[10:] if line.startswith('          ') else line for line in lua.splitlines()) + '\n'
          OUT_PATH.write_text(lua, encoding='utf-8')

          registry = REGISTRY.read_text(encoding='utf-8')
          entry = f'    {{Id="damned-cod-black-ops-zombies",Name="Damned",Artist="Kevin Sherwood",BPM={display_bpm},Categories={{"Famous","Game OST","Call of Duty","Zombies","Dark","Piano","Horror","Complete"}},File="songs/Damned.lua"}},\n'
          if 'Id="damned-cod-black-ops-zombies"' not in registry:
              anchor = '    {Id="un-owen-was-her-death-waltz"'
              idx = registry.find(anchor)
              if idx == -1:
                  idx = registry.rfind('}')
              registry = registry[:idx] + entry + registry[idx:]
              REGISTRY.write_text(registry, encoding='utf-8')

          print(f'Damned: BPM={display_bpm}, PPQ={mid.ticks_per_beat}, note-ons={source_note_ons}, folds={folded}, tracks={musical_tracks}, SHA256={sha256}')
          PY
          python /tmp/convert_damned.py

      - name: Commit Velora song
        run: |
          git config user.name 'Velora Import Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add songs/Damned.lua Songs.lua
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'feat: add Damned from COD Black Ops Zombies'
          git push
