name: Register October piano pack
on:
  push:
    paths:
      - ".github/workflows/register-october-piano.yml"
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import full MIDI modules and refresh library
        shell: python
        run: |
          import base64, zlib, json
          from pathlib import Path
          payload = ""
          modules = json.loads(zlib.decompress(base64.b64decode(payload)).decode("utf-8"))
          expected = {"Mockingbird.lua", "MockingbirdBeginner.lua", "VariationsOnATheme.lua", "MyWar.lua"}
          assert set(modules) == expected, list(modules)
          for name, content in modules.items():
              path = Path("songs") / name
              assert not path.exists(), str(path)
              assert content.startswith("-- Velora 0.10.40 Nova")
              assert "Notes=table.concat(sheet, " in content
              path.write_text(content, encoding="utf-8")
          regpath = Path("Songs.lua")
          reg = regpath.read_text(encoding="utf-8")
          assert "-- Velora 0.10.39 Nova" in reg
          reg = reg.replace("-- Velora 0.10.39 Nova", "-- Velora 0.10.40 Nova", 1)
          entries = [
              "    {Id=\"mockingbird-eminem\",Name=\"Mockingbird\",Artist=\"Eminem\",BPM=85,Categories={\"Famous\",\"Rap\",\"Hip-Hop\",\"Eminem\",\"Piano\",\"Complete\"},File=\"songs/Mockingbird.lua\"},",
              "    {Id=\"mockingbird-eminem-beginner\",Name=\"Mockingbird (Beginner Solo Piano)\",Artist=\"Eminem\",BPM=85,Categories={\"Famous\",\"Rap\",\"Hip-Hop\",\"Eminem\",\"Piano\",\"Beginner\",\"Complete\"},File=\"songs/MockingbirdBeginner.lua\"},",
              "    {Id=\"variations-on-a-theme-toby-fox\",Name=\"Variations on a Theme by Toby Fox\",Artist=\"Toby Fox\",BPM=114,Categories={\"Famous\",\"Game OST\",\"Toby Fox\",\"Piano\",\"Virtuoso\",\"Complete\"},File=\"songs/VariationsOnATheme.lua\"},",
              "    {Id=\"my-war-attack-on-titan\",Name=\"My War (Attack on Titan)\",Artist=\"Shinsei Kamattechan\",BPM=144,Categories={\"Famous\",\"Anime\",\"Attack on Titan\",\"Soundtrack\",\"Piano\",\"Dramatic\",\"Complete\"},File=\"songs/MyWar.lua\"},",
          ]
          for e in entries:
              sid = e.split('Id="', 1)[1].split('"', 1)[0]
              assert ('Id="' + sid + '"') not in reg
          assert reg.count("return {\\n") == 1
          reg = reg.replace("return {\\n", "return {\\n" + "\\n".join(entries) + "\\n", 1)
          regpath.write_text(reg, encoding="utf-8")
          rtpath = Path("runtime.lua")
          rt = rtpath.read_text(encoding="utf-8")
          old = 'AssetRevision = "0.10.39-asturias-1"'
          assert rt.count(old) == 1
          rtpath.write_text(rt.replace(old, 'AssetRevision = "0.10.40-october-four-1"', 1), encoding="utf-8")
          ldpath = Path("loader.lua")
          ld = ldpath.read_text(encoding="utf-8")
          old = "runtime.lua?v=velora-fast-20260930-asturias-1"
          assert ld.count(old) == 2
          ldpath.write_text(ld.replace(old, "runtime.lua?v=velora-fast-20261013-october-four-1"), encoding="utf-8")
          print("Four song modules and cache refreshed.")
      - name: Commit four-song pack
        shell: bash
        run: |
          git config user.name "MrRos3"
          git config user.email "114161345+MrRos3@users.noreply.github.com"
          git add Songs.lua runtime.lua loader.lua songs/Mockingbird.lua songs/MockingbirdBeginner.lua songs/VariationsOnATheme.lua songs/MyWar.lua
          git diff --cached --check
          git commit -m "Add Mockingbird dual versions, Toby Fox Variations, and My War"
          git push
