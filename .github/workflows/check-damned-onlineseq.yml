name: Verify COD Damned sequence sources

on:
  push:
    paths:
      - '.github/workflows/check-damned-onlineseq.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check mido
      - name: Inspect Online Sequencer candidates
        shell: bash
        run: |
          set -u
          for ID in 3941504 4083570 1489325 4648767; do
            echo "===== SEQUENCE $ID ====="
            rm -f "/tmp/$ID.mid"
            curl -L --silent --show-error --max-time 20 -A 'Mozilla/5.0' "https://onlinesequencer.net/$ID.mid" -o "/tmp/$ID.mid" || true
            if [ -f "/tmp/$ID.mid" ] && [ "$(head -c 4 "/tmp/$ID.mid")" = 'MThd' ]; then
              ID="$ID" python - <<'PY'
          import hashlib, mido, os
          ident=os.environ['ID']; p=f'/tmp/{ident}.mid'
          mid=mido.MidiFile(p); tempos=[]; meters=[]; notes=0; names=[]; tempo=500000; seconds=0
          for t in mid.tracks:
              for m in t:
                  if m.type=='track_name' and m.name: names.append(m.name)
                  elif m.type=='set_tempo': tempos.append(m.tempo)
                  elif m.type=='time_signature': meters.append((m.numerator,m.denominator))
                  elif m.type=='note_on' and m.velocity>0 and getattr(m,'channel',-1)!=9: notes+=1
          for m in mido.merge_tracks(mid.tracks):
              seconds += mido.tick2second(m.time, mid.ticks_per_beat, tempo)
              if m.type=='set_tempo': tempo=m.tempo
          print('VALID', ident)
          print('SHA256', hashlib.sha256(open(p,'rb').read()).hexdigest().upper())
          print('TYPE', mid.type, 'PPQ', mid.ticks_per_beat, 'TRACKS', len(mid.tracks))
          print('TRACK_NAMES', names)
          print('TEMPO_BPMS', [round(60000000/x,3) for x in tempos[:20]])
          print('METERS', meters)
          print('NOTE_ONS', notes)
          print('DURATION_SECONDS', round(seconds,3))
          PY
            else
              echo "NOT_MIDI bytes=$(wc -c < "/tmp/$ID.mid" 2>/dev/null || echo 0) head=$(head -c 32 "/tmp/$ID.mid" 2>/dev/null | tr '\n' ' ')"
            fi
          done
