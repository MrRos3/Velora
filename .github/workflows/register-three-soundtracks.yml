name: Register three soundtrack MIDI arrangements
on:
  push:
    paths:
      - ".github/workflows/register-three-soundtracks.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and register all arrangements
        run: |
          from pathlib import Path
          import base64, zlib, hashlib
          payload = {"LetItGo.lua":"","SadnessAndSorrow.lua":"","SchindlersList.lua":""}
          expected = {"LetItGo.lua":"c42e0c2ab465e7f405fa72c7ccaaf725c9889e26eb163dee5f3feae7538a6cff","SadnessAndSorrow.lua":"80ba8d408920deaf430f3143e10d68ac8604e9c396f2203acddaab3405472176","SchindlersList.lua":"ee2258c46a00cace497d39a3cbadb392eee43a033396b8d3ece2012c409766b4"}
          for name, encoded in payload.items():
              raw = zlib.decompress(base64.b64decode(encoded))
              assert hashlib.sha256(raw).hexdigest() == expected[name], name + " integrity mismatch"
              Path("songs", name).write_bytes(raw)
          
          path = Path("Songs.lua")
          catalog = path.read_text()
          assert catalog.startswith("-- Velora 0.10.40 Nova"), "Catalog version changed"
          for slug in ("let-it-go-frozen", "sadness-and-sorrow-naruto", "schindlers-list-theme"):
              assert 'Id="' + slug + '"' not in catalog, "Duplicate song: " + slug
          intro = (
              '    {Id="let-it-go-frozen",Name="Let It Go",Artist="Kristen Anderson-Lopez & Robert Lopez",BPM=74,Categories={"Famous","Soundtrack","Film","Disney","Frozen","Piano","Complete"},File="songs/LetItGo.lua"},\n'
              '    {Id="sadness-and-sorrow-naruto",Name="Sadness and Sorrow",Artist="Toshio Masuda",BPM=75,Categories={"Famous","Anime","Naruto","Soundtrack","Piano","Emotional","Complete"},File="songs/SadnessAndSorrow.lua"},\n'
              '    {Id="schindlers-list-theme",Name="Theme from Schindler\'s List",Artist="John Williams",BPM=68,Categories={"Famous","Soundtrack","Film","Schindler\'s List","John Williams","Piano","Emotional","Complete"},File="songs/SchindlersList.lua"},\n'
          )
          catalog = catalog.replace("-- Velora 0.10.40 Nova", "-- Velora 0.10.41 Nova", 1)
          catalog = catalog.replace("return {\n", "return {\n" + intro, 1)
          path.write_text(catalog)
          
          path = Path("runtime.lua")
          code = path.read_text()
          old='AssetRevision = "0.10.40-october-four-1"'
          assert code.count(old) == 1, "Unexpected runtime revision"
          path.write_text(code.replace(old, 'AssetRevision = "0.10.41-three-soundtracks-1"', 1))
          path = Path("loader.lua")
          code=path.read_text()
          old="velora-fast-20261013-october-four-1"
          assert code.count(old)==2, "Unexpected loader cache key"
          path.write_text(code.replace(old,"velora-fast-20261013-three-soundtracks-1"))
          print("Registered 3 verified arrangements in Velora 0.10.41")
      - name: Commit completed library update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Songs.lua runtime.lua loader.lua songs/LetItGo.lua songs/SadnessAndSorrow.lua songs/SchindlersList.lua
          git commit -m "Velora 0.10.41: add Let It Go, Sadness and Sorrow, Schindlers List"
          git push
