name: Verify Damned MIDI source

on:
  push:
    paths:
      - '.github/workflows/check-damned-source.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Roblox Piano Sheet payload
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://robloxpianosheet.com/sheets/black-ops-2-zombie-theme'
          curl -L --fail --retry 2 --connect-timeout 15 -A 'Mozilla/5.0' "$PAGE" -o /tmp/page.html
          echo "PAGE_BYTES=$(wc -c < /tmp/page.html)"
          python - <<'PY'
          from pathlib import Path
          import re, html
          text=Path('/tmp/page.html').read_text(errors='replace')
          print('HAS_NEXT_DATA', '__NEXT_DATA__' in text)
          print('HAS_320', '320 playable' in text)
          print('HAS_API', '/api/member/midi/black-ops-2-zombie-theme' in text)
          for needle in ['Section 8','a a u o a a a a','black-ops-2-zombie-theme','320 playable']:
              i=text.find(needle)
              print('\nNEEDLE', repr(needle), 'INDEX', i)
              if i>=0:
                  print(html.unescape(text[max(0,i-1200):i+5000]))
          # Print script chunks that appear to contain the slug or note payload.
          for m in re.finditer(r'<script[^>]*>(.*?)</script>', text, re.S|re.I):
              body=html.unescape(m.group(1))
              if 'black-ops-2-zombie-theme' in body or '320 playable' in body or 'a a u o a a a a' in body:
                  print('\n=== MATCHING SCRIPT ===')
                  print(body[:30000])
          PY
