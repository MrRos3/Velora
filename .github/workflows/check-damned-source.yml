name: Verify Damned MIDI source

on:
  push:
    paths:
      - '.github/workflows/check-damned-source.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check mido
      - name: Inspect Roblox Piano Sheet source
        run: |
          set -euo pipefail
          URL='https://robloxpianosheet.com/api/member/midi/black-ops-2-zombie-theme'
          curl -L --fail --retry 2 --connect-timeout 15 -A 'Mozilla/5.0' -e 'https://robloxpianosheet.com/sheets/black-ops-2-zombie-theme' "$URL" -o /tmp/damned.mid
          echo "bytes=$(wc -c < /tmp/damned.mid) head=$(head -c 4 /tmp/damned.mid)"
          test "$(head -c 4 /tmp/damned.mid)" = 'MThd'
          python - <<'PY'
          import hashlib, mido
          p='/tmp/damned.mid'
          mid=mido.MidiFile(p)
          tempos=[]; meters=[]; notes=0; names=[]; tempo=500000; seconds=0
          channels=set()
          pitches=[]
          for t in mid.tracks:
              for m in t:
                  if m.type=='track_name' and m.name: names.append(m.name)
                  elif m.type=='set_tempo': tempos.append(m.tempo)
                  elif m.type=='time_signature': meters.append((m.numerator,m.denominator))
                  elif m.type=='note_on' and m.velocity>0 and getattr(m,'channel',-1)!=9:
                      notes+=1; channels.add(m.channel); pitches.append(m.note)
          for m in mido.merge_tracks(mid.tracks):
              seconds += mido.tick2second(m.time, mid.ticks_per_beat, tempo)
              if m.type=='set_tempo': tempo=m.tempo
          print('SHA256', hashlib.sha256(open(p,'rb').read()).hexdigest().upper())
          print('TYPE', mid.type, 'PPQ', mid.ticks_per_beat, 'TRACKS', len(mid.tracks))
          print('TRACK_NAMES', names)
          print('TEMPO_BPMS', [round(60000000/x,3) for x in tempos[:50]])
          print('METERS', meters)
          print('CHANNELS', sorted(channels))
          print('PITCH_RANGE', (min(pitches), max(pitches)) if pitches else None)
          print('NOTE_ONS', notes)
          print('DURATION_SECONDS', round(seconds,3))
          PY
