name: Register Kefik 3ala Fraqe

on:
  push:
    paths:
      - .github/workflows/register-kefik.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register song and refresh caches
        shell: python
        run: |
          from pathlib import Path

          songs = Path("Songs.lua")
          source = songs.read_text(encoding="utf-8")
          entry = '    {Id="kefik-3ala-fraqe",Name="Kefik 3ala Fraqe",Artist="Fadel Chaker",BPM=80,Categories={"Famous","Arabic","Lebanese","Fadel Chaker","Pop","Romantic","Piano","Complete"},File="songs/Kefik3alaFraqe.lua"},\n'
          if 'Id="kefik-3ala-fraqe"' not in source:
              source = source.replace("-- Velora 0.10.28 Nova", "-- Velora 0.10.29 Nova", 1)
              source = source.replace("return {\n", "return {\n" + entry, 1)
              songs.write_text(source, encoding="utf-8")

          runtime = Path("runtime.lua")
          source = runtime.read_text(encoding="utf-8")
          source = source.replace("0.10.28-arabic-classics-1", "0.10.29-kefik-1")
          runtime.write_text(source, encoding="utf-8")

          loader = Path("loader.lua")
          source = loader.read_text(encoding="utf-8")
          source = source.replace("velora-fast-20260918-arabic-classics-1", "velora-fast-20260918-kefik-1")
          loader.write_text(source, encoding="utf-8")

          Path(".github/workflows/register-kefik.yml").unlink()

      - name: Commit catalog update
        run: |
          git config user.name "MrRos3"
          git config user.email "114161345+MrRos3@users.noreply.github.com"
          git add Songs.lua runtime.lua loader.lua .github/workflows/register-kefik.yml
          git commit -m "Register Fadel Chaker - Kefik 3ala Fraqe"
          git push
