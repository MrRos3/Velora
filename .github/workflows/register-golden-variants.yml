name: Register Golden Brown variants

on:
  push:
    paths:
      - ".github/workflows/register-golden-variants.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add both MIDI arrangements without replacing existing songs
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          modules = {
              "songs/LoveStoryXGoldenBrownIndila.lua": "",
              "songs/LoveStoryXGoldenBrownGaryJamieson.lua": "",
          }
          for filename, encoded in modules.items():
              p = Path(filename)
              if p.exists():
                  raise RuntimeError("Refusing to overwrite an existing song: " + filename)
              decoded = zlib.decompress(base64.b64decode(encoded))
              p.write_bytes(decoded)

          catalog = Path("Songs.lua")
          src = catalog.read_text(encoding="utf-8")
          assert "-- Velora 0.10.42 Nova" in src
          assert "love-story-x-golden-brown-indila-stranglers" not in src
          assert "love-story-x-golden-brown-gary-jamieson" not in src
          src = src.replace("-- Velora 0.10.42 Nova", "-- Velora 0.10.43 Nova", 1)
          entries = (
              '    {Id="love-story-x-golden-brown-indila-stranglers",Name="Love Story × Golden Brown (Indila × The Stranglers)",Artist="Indila × The Stranglers",BPM=96,Categories={"Famous","Mashup","Indila","The Stranglers","Piano","Complete"},File="songs/LoveStoryXGoldenBrownIndila.lua"},\n'
              '    {Id="love-story-x-golden-brown-gary-jamieson",Name="Love Story × Golden Brown (Gary Jamieson)",Artist="Indila × The Stranglers",BPM=184,Categories={"Famous","Mashup","Indila","The Stranglers","Gary Jamieson","Piano","Complete"},File="songs/LoveStoryXGoldenBrownGaryJamieson.lua"},\n'
          )
          src = src.replace("return {\n", "return {\n" + entries, 1)
          catalog.write_text(src, encoding="utf-8")

          for filename, old, new in [
              ("runtime.lua", 'AssetRevision = "0.10.42-golden-ilblu-1"', 'AssetRevision = "0.10.43-golden-variants-1"'),
              ("loader.lua", "velora-fast-20261013-golden-ilblu-1", "velora-fast-20261013-golden-variants-1"),
          ]:
              path = Path(filename)
              txt = path.read_text(encoding="utf-8")
              assert old in txt, "Expected cache key missing: " + filename
              path.write_text(txt.replace(old, new), encoding="utf-8")
          assert "golden-brown-x-love-story" in catalog.read_text(encoding="utf-8")
          print("Two new separate variants added. Previous mashup preserved.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs/LoveStoryXGoldenBrownIndila.lua songs/LoveStoryXGoldenBrownGaryJamieson.lua Songs.lua runtime.lua loader.lua
          git commit -m "Add two Golden Brown Love Story variants without replacements"
          git push
