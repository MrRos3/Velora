name: Register Golden Brown ILBLU
on:
  push:
    paths:
      - ".github/workflows/register-golden-ilblu.yml"
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace arrangement and refresh Velora
        run: |
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          data=""
          content=zlib.decompress(base64.b64decode(data))
          assert zlib.crc32(content)==0x27c67d7f, "Source transfer integrity check failed"
          assert b'Id="golden-brown-x-love-story"' in content
          Path("songs/GoldenBrownXLoveStory.lua").write_bytes(content)
          def change(path,old,new):
              p=Path(path)
              text=p.read_text(encoding="utf-8")
              assert text.count(old)==(2 if path=="loader.lua" else 1),(path,old,text.count(old))
              p.write_text(text.replace(old,new),encoding="utf-8")
          change("Songs.lua","0.10.41 Nova","0.10.42 Nova")
          change("Songs.lua",'Id="golden-brown-x-love-story",Name="Golden Brown × Love Story",Artist="The Stranglers × Indila",BPM=183,','Id="golden-brown-x-love-story",Name="Golden Brown × Love Story",Artist="The Stranglers × Indila",BPM=200,')
          change("runtime.lua",'AssetRevision = "0.10.41-three-soundtracks-1"','AssetRevision = "0.10.42-golden-ilblu-1"')
          change("loader.lua","velora-fast-20261013-three-soundtracks-1","velora-fast-20261013-golden-ilblu-1")
          PY
      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs/GoldenBrownXLoveStory.lua Songs.lua runtime.lua loader.lua
          git diff --cached --quiet || (git commit -m "Replace Golden Brown x Love Story with complete ILBLU arrangement" && git push)
