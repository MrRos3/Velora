name: Convert Mariage d'Amour MIDI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-mariage.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert owner-supplied MIDI to Velora sheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import bisect
          import struct

          MIDI_PATH = Path("midi/George Davidson_ Mariage d'Amour (Midi import).mid")
          OUT_PATH = Path("songs/MariageDAmour.lua")
          CATALOG_PATH = Path("Songs.lua")

          # MIRP / common Roblox virtual-piano layout used by Velora.
          LAYOUT = [
              '1','!','2','@','3','4','$','5','%','6','^','7',
              '8','*','9','(','0','q','Q','w','W','e','E','r',
              't','T','y','Y','u','i','I','o','O','p','P','a',
              's','S','d','D','f','g','G','h','H','j','J','k',
              'l','L','z','Z','x','c','C','v','V','b','B','n','m'
          ]

          def read_vlq(data, pos):
              value = 0
              while True:
                  b = data[pos]
                  pos += 1
                  value = (value << 7) | (b & 0x7F)
                  if not (b & 0x80):
                      return value, pos

          raw = MIDI_PATH.read_bytes()
          if raw[:4] != b'MThd':
              raise SystemExit('Not a Standard MIDI File')

          header_len = int.from_bytes(raw[4:8], 'big')
          fmt, track_count, division = struct.unpack('>HHH', raw[8:14])
          if division & 0x8000:
              raise SystemExit('SMPTE-timed MIDI is not supported by this converter')
          ppqn = division
          pos = 8 + header_len

          tempo_by_tick = {0: 500000}  # default 120 BPM until overridden
          tracks = []

          for track_index in range(track_count):
              if raw[pos:pos+4] != b'MTrk':
                  raise SystemExit(f'Missing MTrk at track {track_index}')
              length = int.from_bytes(raw[pos+4:pos+8], 'big')
              start = pos + 8
              end = start + length
              p = start
              tick = 0
              running = None
              name = ''
              notes = []

              while p < end:
                  delta, p = read_vlq(raw, p)
                  tick += delta
                  status = raw[p]

                  if status < 0x80:
                      if running is None:
                          raise SystemExit(f'Bad running status in track {track_index}')
                      status = running
                  else:
                      p += 1
                      if status < 0xF0:
                          running = status

                  if status == 0xFF:
                      meta_type = raw[p]
                      p += 1
                      size, p = read_vlq(raw, p)
                      payload = raw[p:p+size]
                      p += size
                      if meta_type == 0x03:
                          name = payload.decode('latin1', errors='replace')
                      elif meta_type == 0x51 and len(payload) == 3:
                          tempo_by_tick[tick] = int.from_bytes(payload, 'big')
                      continue

                  if status in (0xF0, 0xF7):
                      size, p = read_vlq(raw, p)
                      p += size
                      running = None
                      continue

                  kind = status & 0xF0
                  channel = status & 0x0F
                  argc = 1 if kind in (0xC0, 0xD0) else 2
                  a = raw[p]
                  p += 1
                  b = raw[p] if argc == 2 else 0
                  if argc == 2:
                      p += 1

                  # We only need attacks because Velora's piano backend is key-tap based.
                  if kind == 0x90 and b > 0 and channel != 9:
                      notes.append((tick, a, b, channel))

              tracks.append({'index': track_index, 'name': name, 'notes': notes})
              pos = end

          # This source contains two actual piano tracks plus extra instrument tracks.
          # Keep the piano arrangement only; fall back to all pitched tracks if needed.
          piano_tracks = [t for t in tracks if 'piano' in t['name'].lower()]
          selected = piano_tracks or tracks
          note_events = [event for t in selected for event in t['notes']]
          if not note_events:
              raise SystemExit('No playable note-on events found')

          tempo_ticks = sorted(tempo_by_tick)
          tempo_values = [tempo_by_tick[t] for t in tempo_ticks]
          tempo_seconds = [0.0] * len(tempo_ticks)
          for i in range(1, len(tempo_ticks)):
              dt = tempo_ticks[i] - tempo_ticks[i-1]
              tempo_seconds[i] = tempo_seconds[i-1] + (dt * tempo_values[i-1]) / (ppqn * 1_000_000)

          def tick_to_seconds(tick):
              i = bisect.bisect_right(tempo_ticks, tick) - 1
              return tempo_seconds[i] + ((tick - tempo_ticks[i]) * tempo_values[i]) / (ppqn * 1_000_000)

          # Initial source tempo is 85 BPM. A 24-step grid gives ~29.4 ms timing
          # resolution while still letting the exact MIDI tempo map determine event placement.
          BPM = 85
          STEPS_PER_BEAT = 24
          STEP_DURATION = (60.0 / BPM) / STEPS_PER_BEAT

          def fold_pitch(note):
              # Fold out-of-range octaves into the 61-key Roblox virtual-piano range.
              while note < 36:
                  note += 12
              while note > 96:
                  note -= 12
              return note

          grouped = {}
          for tick, note, velocity, channel in note_events:
              sec = tick_to_seconds(tick)
              step = max(0, int(round(sec / STEP_DURATION)))
              pitch = fold_pitch(note)
              key = LAYOUT[pitch - 36]
              grouped.setdefault(step, []).append((pitch, key, velocity))

          # De-duplicate identical mapped keys at the same instant while preserving pitch order.
          tokens = {}
          for step, items in grouped.items():
              items.sort(key=lambda x: (x[0], -x[2]))
              keys = []
              seen = set()
              for _, key, _ in items:
                  if key not in seen:
                      seen.add(key)
                      keys.append(key)
              if len(keys) == 1:
                  tokens[step] = keys[0]
              else:
                  tokens[step] = '[' + ''.join(keys) + ']'

          last_step = max(tokens)
          rendered = []
          for step in range(last_step + 1):
              rendered.append(tokens.get(step, '-'))

          # 16 timing cells per line, visually divided into groups of four.
          lines = []
          for i in range(0, len(rendered), 16):
              row = rendered[i:i+16]
              groups = [' '.join(row[j:j+4]) for j in range(0, len(row), 4)]
              lines.append(' | '.join(groups))

          selected_names = ', '.join(t['name'] or f'Track {t["index"]}' for t in selected)
          duration = last_step * STEP_DURATION
          source_name = MIDI_PATH.as_posix()

          lua = f'''-- Velora 0.10.8 Nova — complete arrangement converted from a MIDI supplied by the repository owner.
-- Supplied file: {source_name}
-- Selected MIDI tracks: {selected_names}
-- Timing uses the MIDI tempo map, quantized to {STEP_DURATION*1000:.2f} ms Velora steps.
return {{
    Id="mariage-damour",
    Name="Mariage d'Amour",
    Artist="Paul de Senneville",
    Arrangement="George Davidson",
    BPM={BPM},
    StepsPerBeat={STEPS_PER_BEAT},
    Complete=true,
    Source="Owner-supplied MIDI: {source_name}",
    SourceLicense="User-provided input",
    Categories={{"Famous","Piano","Romantic","Complete"}},
    Notes=[=[
''' + '\n'.join(lines) + '''
]=],
}
'''
          OUT_PATH.write_text(lua, encoding='utf-8')

          catalog = CATALOG_PATH.read_text(encoding='utf-8')
          entry = '    {Id="mariage-damour",Name="Mariage d\\\'Amour",Artist="Paul de Senneville",BPM=85,Categories={"Famous","Piano","Romantic","Complete"},File="songs/MariageDAmour.lua"},\n'
          # Lua double-quoted strings do not require escaping the apostrophe.
          entry = entry.replace("d\\'Amour", "d'Amour")
          if 'Id="mariage-damour"' not in catalog:
              catalog = catalog.replace('return {\n', 'return {\n' + entry, 1)
              CATALOG_PATH.write_text(catalog, encoding='utf-8')

          print(f'Format {fmt}, tracks {track_count}, PPQN {ppqn}')
          print('Selected:', selected_names)
          print(f'Note attacks: {len(note_events)}')
          print(f'Velora events: {len(tokens)}')
          print(f'Duration: {duration:.2f}s')
          print(f'Wrote {OUT_PATH} ({OUT_PATH.stat().st_size} bytes)')
          PY

      - name: Commit generated Velora song
        shell: bash
        run: |
          git config user.name "Velora MIDI Converter"
          git config user.email "actions@users.noreply.github.com"
          git add songs/MariageDAmour.lua Songs.lua
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add Mariage d'Amour MIDI arrangement"
            git push
          fi
