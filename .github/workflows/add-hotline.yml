name: Register Hotline Bling

on:
  push:
    paths:
      - '.github/workflows/add-hotline.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add registry entry
        shell: python
        run: |
          from pathlib import Path
          p = Path('Songs.lua')
          text = p.read_text(encoding='utf-8')
          if 'Id="hotline-bling-gibran-alcocer"' not in text:
              anchor = '    {Id="rain-tony-ann"'
              entry = '    {Id="hotline-bling-gibran-alcocer",Name="Hotline Bling",Artist="Gibran Alcocer",BPM=106,Categories={"Famous","Piano","Cover","Gibran Alcocer","Emotional","Complete"},File="songs/HotlineBling.lua"},\n'
              i = text.index(anchor)
              text = text[:i] + entry + text[i:]
              p.write_text(text, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Velora Import Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Songs.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: register Hotline Bling'
          git push
