name: Register new Velora dishes

on:
  push:
    paths:
      - '.github/workflows/register-new-dishes.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Register songs and refresh cache
        shell: python
        run: |
          from pathlib import Path

          songs_path = Path('Songs.lua')
          songs = songs_path.read_text(encoding='utf-8')
          songs = songs.replace('-- Velora 0.10.33 Nova — expanded MIDI song library.', '-- Velora 0.10.34 Nova — expanded MIDI song library.', 1)

          entries = [
              '    {Id="conquest-of-paradise-vangelis",Name="Conquest of Paradise",Artist="Vangelis",BPM=70,Categories={"Famous","Soundtrack","Film","Vangelis","Cinematic","Epic","Piano","Patrik Pietschmann","Complete"},File="songs/ConquestOfParadise.lua"},',
              '    {Id="lambada-kaoma",Name="Lambada",Artist="Kaoma",BPM=120,Categories={"Famous","Latin","Dance","Kaoma","Piano","Upbeat","Complete"},File="songs/Lambada.lua"},',
              '    {Id="la-maritza-sylvie-vartan",Name="La Maritza",Artist="Sylvie Vartan",BPM=76,Categories={"Famous","French","Chanson","Sylvie Vartan","Piano","Emotional","Complete"},File="songs/LaMaritza.lua"},',
          ]
          missing = [e for e in entries if e.split('Id="',1)[1].split('"',1)[0] not in songs]
          if missing:
              songs = songs.replace('return {\n', 'return {\n' + '\n'.join(missing) + '\n', 1)
          songs_path.write_text(songs, encoding='utf-8')

          runtime_path = Path('runtime.lua')
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime = runtime.replace('AssetRevision = "0.10.33-ievan-midi-1"', 'AssetRevision = "0.10.34-dishes-1"', 1)
          runtime_path.write_text(runtime, encoding='utf-8')

          loader_path = Path('loader.lua')
          loader = loader_path.read_text(encoding='utf-8')
          loader = loader.replace('runtime.lua?v=velora-fast-20260918-ievan-midi-1', 'runtime.lua?v=velora-fast-20260919-dishes-1')
          loader_path.write_text(loader, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Songs.lua runtime.lua loader.lua
          git diff --cached --quiet || git commit -m "Register Conquest of Paradise, Lambada, and La Maritza"
          git push
